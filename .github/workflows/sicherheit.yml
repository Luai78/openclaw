# Weekly security scan: gitleaks, zizmor, osv-scanner.
# Logic and documentation: https://github.com/Luai78/sicherheitsnetz
name: Sicherheit

on:
  schedule:
    - cron: "35 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".gitleaksignore"

permissions: {}

jobs:
  scan:
    permissions:
      contents: read
    uses: Luai78/sicherheitsnetz/.github/workflows/scan.yml@main
